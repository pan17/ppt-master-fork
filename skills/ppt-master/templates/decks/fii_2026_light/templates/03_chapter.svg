<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="fii_light_master" data-pptx-master-name="FII Light Master" data-pptx-layout="chapter" data-pptx-layout-name="Chapter Divider">
  <image id="chapter-background" x="0" y="0" width="1280" height="720" href="../images/content_bg.jpg" preserveAspectRatio="xMidYMid slice" data-pptx-layer="layout" data-pptx-editable="false"/>
  <g id="chapter-number-slot" data-pptx-placeholder="body" data-pptx-bounds="60 160 400 140"><text id="chapter-number-carrier" x="60" y="280" fill="#000000" font-family="Source Han Sans CN Heavy, Microsoft YaHei, 微软雅黑, sans-serif" font-size="120" font-weight="bold" data-pptx-carrier="true">{{CHAPTER_NUM}}</text></g>
  <g id="chapter-title-slot" data-pptx-placeholder="title" data-pptx-bounds="60 340 760 80"><text id="chapter-title-carrier" x="60" y="400" fill="#000000" font-family="Source Han Sans CN Heavy, Microsoft YaHei, 微软雅黑, sans-serif" font-size="48" font-weight="bold" data-pptx-carrier="true">{{CHAPTER_TITLE}}</text></g>
  <g id="chapter-description-slot" data-pptx-placeholder="subtitle" data-pptx-idx="2" data-pptx-bounds="60 435 920 40"><text id="chapter-description-carrier" x="60" y="470" fill="#000000" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="18" data-pptx-carrier="true">{{CHAPTER_DESC}}</text></g>
  <g id="chapter-folio-slot" data-pptx-placeholder="slide-number" data-pptx-idx="3" data-pptx-bounds="1125 699 95 24" data-pptx-locked="true" data-pptx-locked-anchor="1220 714"><text id="chapter-folio-carrier" x="1220" y="714" text-anchor="end" fill="#FFFFFF" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="14" opacity="0.7" data-pptx-carrier="true" data-pptx-locked-carrier="true">{{PAGE_NUM}}/{{TOTAL_PAGES}}</text></g>
</svg>
