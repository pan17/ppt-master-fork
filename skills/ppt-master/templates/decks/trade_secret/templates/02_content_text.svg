  <g id="content-title-slot" data-pptx-placeholder="title" data-pptx-bounds="110 40 1060 55"><text id="content-title-carrier" x="110" y="80" fill="#000000" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="36" font-weight="bold" data-pptx-carrier="true">{{PAGE_TITLE}}</text></g>
  <g id="content-object-slot" data-pptx-placeholder="body" data-pptx-idx="1" data-pptx-bounds="60 130 1160 540"><text id="content-object-carrier" x="110" y="170" fill="#000000" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="27" data-pptx-carrier="true"><tspan x="110" dy="0">本页为营业秘密模板文字版正文示范，同一段落的中间行必须写满至内容区右缘附近，</tspan><tspan x="110" dy="36">禁止在行宽仍有余量时提前换行；仅段落最后一行允许短行。条款编号写在正文里。</tspan><tspan x="110" dy="48">1. 续行仍从左缘起排，不悬挂缩进，也不使用项目符号圆点；长英文词放不下时整段</tspan><tspan x="110" dy="36">移到下一行，上一行仍须用其他词语填满可用宽度。</tspan><tspan x="110" dy="48">2. 字号固定 27px，可用宽度按约 1060px 计算，每行目标 36 至 39 个汉字，下游</tspan><tspan x="110" dy="36">生成时以 {{CONTENT_AREA}} 替换本示范段落。</tspan></text></g>
